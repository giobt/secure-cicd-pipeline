---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-secure
  namespace: default
  labels:
    app: hello-secure
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hello-secure
  template:
    metadata:
      labels:
        app: hello-secure
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: hello-secure
          # This tag is replaced dynamically by the pipeline
          image: hello-secure:latest
          imagePullPolicy: Never  # Image is pre-loaded into KinD
          ports:
            - containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "500m"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
---
apiVersion: v1
kind: Service
metadata:
  name: hello-secure
  namespace: default
spec:
  selector:
    app: hello-secure
  ports:
    - port: 80
      targetPort: 8080
      protocol: TCP
  type: ClusterIP